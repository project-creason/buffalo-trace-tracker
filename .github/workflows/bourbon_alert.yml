name: Buffalo Trace Daily Bourbon Alert

on:
  schedule:
    # Monday - Saturday (starts earlier in UTC to account for GitHub cron queue lag, covering 6:30 AM - 9:15 AM ET)
    - cron: "17,47 9-10 * * 1-6"
    - cron: "2,17,32,47 11-13 * * 1-6"
    - cron: "2,17 14 * * 1-6"
    # Sunday (starts at 6:30 AM ET ahead of Gift Shop opening and polls through 11:30 AM ET)
    - cron: "17,47 9-10 * * 0"
    - cron: "2,17,32,47 11-15 * * 0"
    - cron: "2,17,32 16 * * 0"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send test alert even if lineup hasn't changed"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run (fetch & log availability without sending notifications)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [check_bourbon]

permissions:
  contents: write

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Buffalo Trace Availability & Send Alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || vars.NOTIFY_EMAIL }}
          NOTIFY_SMS_GATEWAY: ${{ secrets.NOTIFY_SMS_GATEWAY || vars.NOTIFY_SMS_GATEWAY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          TARGET_BOURBONS: ${{ secrets.TARGET_BOURBONS || vars.TARGET_BOURBONS }}
        run: |
          ARGS="--state-file last_state.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            ARGS="$ARGS --force-notify"
          fi
          python check_bourbon.py $ARGS

      - name: Save Updated Lineup State
        if: success() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet last_state.json; then
            git add last_state.json
            git commit -m "Update last alerted bourbon state [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No change to last_state.json; nothing to commit."
          fi
