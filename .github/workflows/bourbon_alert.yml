name: Buffalo Trace Daily Bourbon Alert

on:
  schedule:
    # Runs daily at 13:15 UTC (9:15 AM EDT / 8:15 AM EST) and 14:15 UTC (10:15 AM EDT / 9:15 AM EST)
    # right around when the Buffalo Trace Gift Shop updates daily availability.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send test alert even if no target allocated bottles are available"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run (fetch & log availability without sending Email/SMS)"
        required: false
        default: false
        type: boolean

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Buffalo Trace Availability & Send Alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || vars.NOTIFY_EMAIL }}
          NOTIFY_SMS_GATEWAY: ${{ secrets.NOTIFY_SMS_GATEWAY || vars.NOTIFY_SMS_GATEWAY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          TARGET_BOURBONS: ${{ secrets.TARGET_BOURBONS || vars.TARGET_BOURBONS }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            ARGS="$ARGS --force-notify"
          fi
          python check_bourbon.py $ARGS
